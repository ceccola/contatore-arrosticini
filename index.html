<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a0f0a" />
<title>Contatore Arrosticini</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(120% 90% at 50% 0%, #3b1d10 0%, #1a0f0a 55%, #0b0604 100%);
    display: grid;
    place-items: center;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Coriandoli: sopra al resto, trasparenti ai click */
  #confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.6vh, 26px);
    padding: 24px;
    text-align: center;
  }

  .hint {
    margin: 0;
    font-size: clamp(.78rem, 2.9vmin, .95rem);
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255, 200, 150, .55);
  }

  .counter {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    padding: 0;
    width: min(74vmin, 4in);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid;
    place-content: center;
    justify-items: center;
    position: relative;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    transition: transform .12s ease;
  }

  .counter::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%,
      rgba(255, 150, 60, .30) 0%,
      rgba(255, 120, 40, .08) 52%,
      rgba(255, 120, 40, 0) 72%);
    border: 1px solid rgba(255, 170, 90, .22);
    box-shadow:
      0 0 90px rgba(255, 110, 40, .22),
      inset 0 0 70px rgba(255, 120, 50, .10);
  }

  .counter:active {
    transform: scale(.965);
  }

  .counter:focus-visible {
    outline: 2px solid rgba(255, 190, 120, .8);
    outline-offset: 6px;
  }

  .icon {
    display: block;
    width: clamp(96px, 30vmin, 168px);
    height: auto;
    margin-bottom: clamp(2px, 1vmin, 10px);
    filter: drop-shadow(0 8px 20px rgba(255, 120, 40, .35));
    transform: rotate(-7deg);
    transition: transform .25s cubic-bezier(.2, 1.4, .4, 1);
  }

  .counter:hover .icon {
    transform: rotate(0deg) translateY(-2px);
  }

  .counter:active .icon {
    transform: rotate(-2deg) scale(.97);
  }

  .number {
    display: block;
    font-size: clamp(5rem, 30vmin, 11rem);
    font-weight: 800;
    line-height: .92;
    letter-spacing: -.045em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(255, 140, 60, .5);
  }

  .number.pop {
    animation: pop .34s cubic-bezier(.2, 1.7, .4, 1);
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    38%  { transform: scale(1.17); }
    100% { transform: scale(1); }
  }

  .label {
    font-size: clamp(.85rem, 3.2vmin, 1.15rem);
    font-weight: 600;
    letter-spacing: .04em;
    color: rgba(255, 205, 160, .8);
  }

  .milestone {
    min-height: 2.6em;
    max-width: 22em;
    margin: 0;
    display: grid;
    place-items: center;
    font-size: clamp(.95rem, 3.6vmin, 1.3rem);
    font-weight: 700;
    line-height: 1.25;
    color: #ffd39a;
    text-shadow: 0 0 26px rgba(255, 150, 60, .7);
    opacity: 0;
    transform: translateY(8px) scale(.94);
    transition: opacity .28s ease, transform .28s cubic-bezier(.2, 1.4, .4, 1);
  }

  .milestone.show {
    opacity: 1;
    transform: none;
  }
</style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main>
    <p class="hint">Tocca per aggiungere un arrosticino</p>

    <button class="counter" id="counter" type="button">
      <svg class="icon" viewBox="0 0 100 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arrosticino">
        <defs>
          <linearGradient id="stickGrad" x1="2" y1="21" x2="98" y2="25" gradientUnits="userSpaceOnUse">
            <stop stop-color="#7d5730" />
            <stop offset=".35" stop-color="#dfbc8c" />
            <stop offset=".7" stop-color="#b78c58" />
            <stop offset="1" stop-color="#8a6136" />
          </linearGradient>
          <radialGradient id="meatA" cx=".42" cy=".32" r=".8">
            <stop stop-color="#f2ab6b" />
            <stop offset=".42" stop-color="#c5713a" />
            <stop offset=".78" stop-color="#8b441b" />
            <stop offset="1" stop-color="#5b270e" />
          </radialGradient>
          <radialGradient id="meatB" cx=".56" cy=".3" r=".82">
            <stop stop-color="#e49a5a" />
            <stop offset=".48" stop-color="#b2632c" />
            <stop offset=".82" stop-color="#7c3b17" />
            <stop offset="1" stop-color="#4e210c" />
          </radialGradient>
          <radialGradient id="emberGlow" cx=".5" cy=".5" r=".5">
            <stop stop-color="#ff8a2b" stop-opacity=".4" />
            <stop offset="1" stop-color="#ff8a2b" stop-opacity="0" />
          </radialGradient>
        </defs>

        <ellipse cx="52" cy="23" rx="50" ry="20" fill="url(#emberGlow)" />

        <!-- spiedo -->
        <rect x="2" y="21.2" width="96" height="3.4" rx="1.7" fill="url(#stickGrad)" />
        <path d="M92.5 21.1 L98 22.9 L92.5 24.7 Z" fill="#dcb489" />

        <!-- pezzi di carne: cubetti infilzati, con luce di taglio e bordi anneriti -->
        <g transform="rotate(-4 21 22.9)">
          <rect x="11" y="9" width="19" height="28" rx="5" fill="url(#meatA)" stroke="#3f1b07" stroke-opacity=".4" />
          <path d="M13.5 12.8 q6.5 -4.4 14 -1" stroke="#ffdcb2" stroke-opacity=".26" stroke-width="1.9" fill="none" stroke-linecap="round" />
          <ellipse cx="28.2" cy="22.6" rx="2.2" ry="6.5" fill="#2b0f02" opacity=".2" />
          <ellipse cx="18" cy="28.6" rx="3.1" ry="2" fill="#2b0f02" opacity=".14" transform="rotate(-16 18 28.6)" />
        </g>

        <g transform="rotate(3 42 22.9)">
          <rect x="32" y="7.6" width="20" height="30" rx="5" fill="url(#meatB)" stroke="#3f1b07" stroke-opacity=".4" />
          <path d="M34.6 11.6 q7 -4.6 14.6 -0.8" stroke="#ffdcb2" stroke-opacity=".22" stroke-width="1.9" fill="none" stroke-linecap="round" />
          <ellipse cx="50.2" cy="23.4" rx="2.4" ry="7" fill="#2b0f02" opacity=".22" />
          <ellipse cx="39.5" cy="15.4" rx="2.6" ry="1.7" fill="#2b0f02" opacity=".15" transform="rotate(14 39.5 15.4)" />
        </g>

        <g transform="rotate(-2 63 22.9)">
          <rect x="54" y="8.2" width="19" height="29" rx="5" fill="url(#meatA)" stroke="#3f1b07" stroke-opacity=".4" />
          <path d="M56.5 12 q6.6 -4.4 14 -1" stroke="#ffdcb2" stroke-opacity=".25" stroke-width="1.9" fill="none" stroke-linecap="round" />
          <ellipse cx="71.6" cy="22.8" rx="2.2" ry="6.6" fill="#2b0f02" opacity=".2" />
          <ellipse cx="61" cy="29" rx="3" ry="1.9" fill="#2b0f02" opacity=".14" transform="rotate(12 61 29)" />
        </g>

        <g transform="rotate(4 83 22.9)">
          <rect x="75" y="9.2" width="18" height="27.5" rx="5" fill="url(#meatB)" stroke="#3f1b07" stroke-opacity=".4" />
          <path d="M77.4 13 q6.2 -4 13 -0.9" stroke="#ffdcb2" stroke-opacity=".2" stroke-width="1.9" fill="none" stroke-linecap="round" />
          <ellipse cx="92" cy="23" rx="2" ry="6.2" fill="#2b0f02" opacity=".2" />
          <ellipse cx="82" cy="16.4" rx="2.4" ry="1.6" fill="#2b0f02" opacity=".14" transform="rotate(-18 82 16.4)" />
        </g>
      </svg>
      <span class="number" id="count">0</span>
      <span class="label" id="label">arrosticini</span>
    </button>

    <p class="milestone" id="milestone" aria-live="polite"></p>
  </main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const button = document.getElementById("counter");
  const countEl = document.getElementById("count");
  const labelEl = document.getElementById("label");
  const milestoneEl = document.getElementById("milestone");

  const PALETTE = ["#ff6b35", "#ffb703", "#fb8500", "#e63946", "#ffd166", "#fff1d6"];
  const MILESTONES = {
    5: "Cinque! Si comincia a fare sul serio 🔥",
    10: "Dieci! Mani unte, cuore contento 🍢",
    15: "Quindici! Veterano della brace 🔥",
    20: "Venti! Leggenda degli arrosticini 🏆",
  };

  let W = 0;
  let H = 0;
  let particles = [];
  let running = false;

  /* ---------- canvas ---------- */

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  resize();
  window.addEventListener("resize", resize);

  /* ---------- coriandoli ---------- */

  const MAX_PARTICLES = 700;

  function spawn(x, y, opts) {
    opts = opts || {};
    const count = opts.count == null ? 26 : opts.count;
    const spread = opts.spread == null ? Math.PI * 1.2 : opts.spread;
    const speed = opts.speed == null ? 8 : opts.speed;
    const dir = opts.dir == null ? -Math.PI / 2 : opts.dir;
    const emojis = opts.emojis == null ? 0 : opts.emojis;

    const push = (p) => {
      if (particles.length < MAX_PARTICLES) particles.push(p);
    };

    for (let i = 0; i < count; i++) {
      const angle = dir + (Math.random() - 0.5) * spread;
      const v = speed * (0.35 + Math.random() * 0.9);
      push({
        kind: "rect",
        x: x,
        y: y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v,
        w: 5 + Math.random() * 7,
        h: 3 + Math.random() * 5,
        color: PALETTE[(Math.random() * PALETTE.length) | 0],
        rot: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.4,
        g: 0.2 + Math.random() * 0.14,
        drag: 0.988,
        age: 0,
        life: 90 + Math.random() * 70,
      });
    }

    for (let i = 0; i < emojis; i++) {
      const angle = dir + (Math.random() - 0.5) * spread;
      const v = speed * (0.4 + Math.random() * 0.7);
      push({
        kind: "emoji",
        text: Math.random() < 0.55 ? "🍢" : "🔥",
        size: 16 + Math.random() * 14,
        x: x,
        y: y,
        vx: Math.cos(angle) * v,
        vy: Math.sin(angle) * v,
        rot: (Math.random() - 0.5) * 0.6,
        vr: (Math.random() - 0.5) * 0.14,
        g: 0.16,
        drag: 0.99,
        age: 0,
        life: 110 + Math.random() * 60,
      });
    }

    start();
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (p.life - p.age) / 26);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);

    if (p.kind === "rect") {
      // leggera rotazione "a lamina" per un effetto più fisico
      ctx.scale(1, Math.max(0.25, Math.abs(Math.cos(p.rot * 0.9))));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    } else {
      ctx.font = p.size + 'px system-ui, -apple-system, "Segoe UI Emoji", sans-serif';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(p.text, 0, 0);
    }

    ctx.restore();
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.vy += p.g;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.x += p.vx + Math.sin(p.age * 0.14 + p.rot) * 0.25;
      p.y += p.vy;
      p.rot += p.vr;
      p.age++;

      if (p.age >= p.life || p.y > H + 120 || p.x < -140 || p.x > W + 140) {
        particles.splice(i, 1);
        continue;
      }

      drawParticle(p);
    }

    if (particles.length > 0) {
      requestAnimationFrame(frame);
    } else {
      running = false;
      ctx.clearRect(0, 0, W, H);
    }
  }

  function start() {
    if (running) return;
    running = true;
    requestAnimationFrame(frame);
  }

  /* ---------- UI ---------- */

  function pop(el) {
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
  }

  let milestoneTimer = 0;

  function showMilestone(text) {
    milestoneEl.textContent = text;
    milestoneEl.classList.remove("show");
    void milestoneEl.offsetWidth;
    milestoneEl.classList.add("show");
    clearTimeout(milestoneTimer);
    milestoneTimer = setTimeout(() => milestoneEl.classList.remove("show"), 2800);
  }

  let count = 0;

  button.addEventListener("click", (event) => {
    count++;
    countEl.textContent = count;
    labelEl.textContent = count === 1 ? "arrosticino" : "arrosticini";
    pop(countEl);

    const rect = button.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    // detail === 0 => click da tastiera (nessuna coordinata utile)
    const fromKeyboard = event.detail === 0;
    const x = fromKeyboard ? cx : event.clientX;
    const y = fromKeyboard ? cy : event.clientY;

    const message = MILESTONES[count];

    if (message) {
      const centerX = W / 2;
      const centerY = H * 0.58;
      spawn(x, y, { count: 40, speed: 11, emojis: 3 });
      spawn(centerX, centerY, { count: 110, speed: 15, spread: Math.PI * 1.7, emojis: 8 });
      spawn(W * 0.12, H * 0.72, { count: 55, speed: 14, dir: -Math.PI / 2.4 });
      spawn(W * 0.88, H * 0.72, { count: 55, speed: 14, dir: -Math.PI / 1.7 });
      showMilestone(message);
    } else {
      spawn(x, y, { count: 28, speed: 9 });
    }
  });
})();
</script>
</body>
</html>
